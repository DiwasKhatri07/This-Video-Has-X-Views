# =============================================================================
#  📊 Live Metrics Badge Generator — GitHub Actions Workflow
#  Updates dynamic SVG badges in README showing live YouTube stats
# =============================================================================

name: 📊 Update Live Metrics Badges

on:
  schedule:
    - cron: "*/10 * * * *"  # Every 10 minutes
  workflow_dispatch:

jobs:
  update-badges:
    name: 🏷️ Generate Live Badges
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install Dependencies
        run: pip install google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: 🔐 Restore OAuth Token
        run: echo "${{ secrets.YOUTUBE_TOKEN_PICKLE_B64 }}" | base64 -d > token.pickle

      - name: 🔑 Restore Client Secret
        run: echo "${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}" > client_secret.json

      - name: 📊 Fetch Stats & Generate Badge JSON
        run: python scripts/generate_badges.py

      - name: 📤 Commit Updated Badges
        run: |
          git config user.name "YouTube Bot"
          git config user.email "bot@diwaskhatri.dev"
          git add badges/ metrics.json
          git diff --cached --quiet || git commit -m "📊 Update live YouTube metrics badges"
          git push
