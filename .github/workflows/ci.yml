name: Python CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "badges/**"
      - "metrics.json"
      - "replied_comments.json"
  pull_request:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "badges/**"
      - "metrics.json"
      - "replied_comments.json"

permissions:
  contents: read

jobs:
  validate:
    name: Compile Python sources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Python syntax
        run: python -m py_compile main.py title.py auth.py scripts/generate_badges.py
